name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saturivo-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript, tests and manifest
        run: npm run verify
      - name: Generate reproducible dependency SBOM
        if: runner.os == 'Linux'
        run: |
          mkdir -p reports
          npm sbom --sbom-format cyclonedx > reports/saturivo-sbom.cdx.json
      - name: Generate exact-lockfile license inventory
        if: runner.os == 'Linux'
        run: npm run licenses:report
      - name: Archive dependency SBOM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturivo-sbom
          path: |
            reports/saturivo-sbom.cdx.json
            reports/saturivo-licenses.json
            reports/saturivo-licenses.md
          if-no-files-found: error
      - name: Package preview VSIX
        if: runner.os == 'Linux'
        run: npx --no-install vsce package --no-dependencies --out saturivo.vsix
      - name: Audit and checksum preview VSIX
        if: runner.os == 'Linux'
        run: |
          npm run audit:vsix
          npm run checksum:vsix
      - name: Upload preview VSIX
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturivo-preview-vsix
          path: |
            saturivo.vsix
            saturivo.vsix.sha256
          if-no-files-found: error

  integration-k6:
    name: Local k6 integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install TypeScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile once for the integration fixture
        run: npm run build
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
        with:
          k6-version: '1.8.2'
      - name: Verify real k6 against disposable loopback fixture
        run: npm run test:integration:k6
        env:
          K6_NO_USAGE_REPORT: 'true'
      - name: Verify real 3+3 repeated trials, control and injected-latency regression
        run: npm run test:integration:regression
        env:
          K6_NO_USAGE_REPORT: 'true'

  extension-host:
    name: Real VS Code Extension Host (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Access the immutable 0.1.0 baseline for a real upgrade check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Package VSIX for real CLI installation
        run: npx --no-install vsce package --no-dependencies --out saturivo.vsix
      - name: Audit VSIX before host installation
        run: npm run audit:vsix
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
        with:
          k6-version: '1.8.2'
      - name: Launch actual VS Code 1.99 Extension Host, run and cancel real k6
        run: xvfb-run -a npm run test:integration:vscode
        env:
          K6_NO_USAGE_REPORT: 'true'
      - name: Upgrade installed VSIX from pinned 0.1.0 to candidate 0.1.1
        run: node scripts/verify-vsix-upgrade.cjs

  go-runtime-evidence:
    name: Real Go race and pprof fixture (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Verify real Go race evidence and pprof
        run: node scripts/go-evidence.cjs
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
        with:
          k6-version: '1.8.2'
      - name: Verify real HTTP k6 on Go, Node.js and Python
        run: npm run test:integration:runtimes
        env:
          K6_NO_USAGE_REPORT: 'true'
      - name: Verify real loopback WebSocket k6 protocol
        run: npm run test:integration:websocket
        env:
          K6_NO_USAGE_REPORT: 'true'

  screenshots:
    name: Capture actual Control Center views for README
    # Restricted to the maintainer's 0.1.1 feature branch. Never writes to main or forks.
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/enterprise-aaaa-v0.1.1' && github.event.pull_request.head.repo.full_name == 'Drako01/saturivo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true # only this trusted documentation screenshot job
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Render four production UI views with synthetic fixture data
        run: npm run screenshots:readme
      - name: Upload screenshots for reviewer inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturivo-control-center-screenshots
          path: media/screenshots/*.png
          if-no-files-found: error
      - name: Commit changed generated screenshots to THIS feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git add media/screenshots/
          if git diff --staged --quiet; then
            echo "Readme screenshots are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): capture 0.1.1 control center from production renderer"
          git push origin "HEAD:refs/heads/feat/enterprise-aaaa-v0.1.1"
          # GitHub-token pushes do not trigger workflows. Dispatch explicitly at the new commit.
          GH_TOKEN="${{ github.token }}" gh workflow run ci.yml --ref feat/enterprise-aaaa-v0.1.1
