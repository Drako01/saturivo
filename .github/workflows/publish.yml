# Production release automatically starts only on a version-bumping merge to main.
# scripts/verify-merge-ci.cjs checks the merged PR HEAD tree and exact green CI
# before package creation. The immutable release tag is created inside this run.
# Marketplace / Open VSX keep their protected OIDC environments.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter PUBLISH_SATURIVO to authorize this main revision
        required: true
        type: string
      version:
        description: Must match package.json version
        required: true
        type: string
      registries:
        type: choice
        options: [both, marketplace, open-vsx]
        default: both
      recovery_run_id:
        description: Optional run ID whose verified VSIX must be reused (same SHA only)
        required: false
        type: string
permissions: {}
concurrency:
  group: saturivo-publish
  cancel-in-progress: false
jobs:
  authorize:
    name: Verify exact merged PR CI before release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # Compare prior main version without rerunning PR CI
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Authorize release from exact green PR HEAD without retesting
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/verify-merge-ci.cjs

  package:
    name: Verify and package immutable VSIX
    needs: authorize
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and package validated main tree (no duplicate PR tests)
        if: inputs.recovery_run_id == ''
        run: |
          npm run build
          npm run smoke:manifest
          npx --no-install vsce package --no-dependencies --out saturivo.vsix
          node scripts/vsix-checksum.cjs write saturivo.vsix
      - name: Reuse earlier immutable VSIX for partial-publish recovery
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: saturivo-release-vsix
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Audit exact bytes, SHA and candidate manifest
        id: checksum
        env:
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        shell: bash
        run: |
          npm run audit:vsix
          node scripts/vsix-checksum.cjs check saturivo.vsix
          if [[ ! -f saturivo.release.json ]]; then
            [[ -z "${{ inputs.recovery_run_id }}" ]] || { echo "::error::Recovery manifest missing"; exit 1; }
            node scripts/release-manifest.cjs write saturivo.vsix "$GITHUB_SHA" "$RELEASE_VERSION"
          fi
          node scripts/release-manifest.cjs check saturivo.vsix "$GITHUB_SHA" "$RELEASE_VERSION"
          echo "sha256=$(cut -d' ' -f1 saturivo.vsix.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturivo-release-vsix
          path: |
            saturivo.vsix
            saturivo.vsix.sha256
            saturivo.release.json
          if-no-files-found: error
          retention-days: 90
      - name: Generate CycloneDX SBOM and exact license inventory
        run: |
          mkdir -p reports
          npm sbom --sbom-format cyclonedx > reports/saturivo-sbom.cdx.json
          npm run licenses:report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saturivo-release-evidence
          path: |
            reports/saturivo-sbom.cdx.json
            reports/saturivo-licenses.json
            reports/saturivo-licenses.md
          if-no-files-found: error
          retention-days: 90
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: saturivo.vsix
          create-storage-record: false

  release-tag:
    name: Create immutable tag for verified merge
    needs: [authorize, package]
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create once, then verify the exact protected release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          ref="refs/tags/$tag"
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main advanced during release; refuse stale publication"; exit 1;
          }
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            [[ "$existing" == "$GITHUB_SHA" ]] || {
              echo "::error::Protected tag exists for another commit"; exit 1;
            }
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              --raw-field ref="$ref" --raw-field sha="$GITHUB_SHA" >/dev/null
          fi
          recorded=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')
          [[ "$recorded" == "$GITHUB_SHA" ]] || {
            echo "::error::Protected tag SHA verification failed"; exit 1;
          }
          echo "Immutable $tag -> $recorded"

  marketplace:
    name: Publish Visual Studio Marketplace via OIDC
    needs: [authorize, package, release-tag]
    if: needs.authorize.outputs.publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.registries == 'both' || inputs.registries == 'marketplace')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: saturivo-release-vsix
      - name: Verify artifact identical to build job
        env:
          EXPECTED_SHA: ${{ needs.package.outputs.sha256 }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          node scripts/vsix-checksum.cjs check saturivo.vsix --expect "$EXPECTED_SHA"
          node scripts/release-manifest.cjs check saturivo.vsix "$GITHUB_SHA" "$RELEASE_VERSION"
      - name: Install pinned OIDC publisher
        run: npm install --global --ignore-scripts --no-audit --no-fund @vscode/vsce@4.1.0
      - name: Publish exact verified package (no rebuild)
        run: vsce publish --oidc --packagePath saturivo.vsix --skip-duplicate

  open-vsx:
    name: Publish Open VSX via OIDC
    needs: [authorize, package, release-tag]
    if: needs.authorize.outputs.publish == 'true' && (github.event_name != 'workflow_dispatch' || inputs.registries == 'both' || inputs.registries == 'open-vsx')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: saturivo-release-vsix
      - name: Verify artifact identical to build job
        env:
          EXPECTED_SHA: ${{ needs.package.outputs.sha256 }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          node scripts/vsix-checksum.cjs check saturivo.vsix --expect "$EXPECTED_SHA"
          node scripts/release-manifest.cjs check saturivo.vsix "$GITHUB_SHA" "$RELEASE_VERSION"
      - name: Install pinned Open VSX publisher
        run: npm install --global --ignore-scripts --no-audit --no-fund ovsx@1.3.0
      - name: Publish exact verified package (no rebuild)
        run: ovsx publish saturivo.vsix --trusted-publishing

  github-release:
    name: GitHub Release from protected tag
    needs: [authorize, package, release-tag, marketplace, open-vsx]
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.release-tag.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.marketplace.result) && contains(fromJSON('["success","skipped"]'), needs.open-vsx.result) && (needs.marketplace.result == 'success' || needs.open-vsx.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: saturivo-release-vsix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: saturivo-release-evidence
          path: reports
      - name: Verify release asset immutability
        env:
          EXPECTED_SHA: ${{ needs.package.outputs.sha256 }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          node scripts/vsix-checksum.cjs check saturivo.vsix --expect "$EXPECTED_SHA"
          node scripts/release-manifest.cjs check saturivo.vsix "$GITHUB_SHA" "$RELEASE_VERSION"
      - name: Create GitHub Release using already approved protected tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.authorize.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; verifying its published assets."
          else
            gh release create "$tag" saturivo.vsix saturivo.vsix.sha256 saturivo.release.json reports/saturivo-sbom.cdx.json reports/saturivo-licenses.json reports/saturivo-licenses.md \
              --title "Saturivo $RELEASE_VERSION" --generate-notes
          fi
          mkdir -p verify
          # The checksum checker requires <vsix>.sha256 alongside the downloaded VSIX.
          gh release download "$tag" --pattern 'saturivo.vsix*' --dir verify
          node scripts/vsix-checksum.cjs check verify/saturivo.vsix --expect "$(cut -d' ' -f1 saturivo.vsix.sha256)"
