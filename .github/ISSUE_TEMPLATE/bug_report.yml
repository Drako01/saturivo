name: "Bug report / Reportar error"
description: "Reproducible errors in Saturivo (no private endpoints or credentials)"
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Use sanitized local fixtures. Do not include confidential URLs, tokens, raw profiles or customer information. Security issues must be disclosed privately."
  - type: textarea
    id: summary
    attributes:
      label: "Issue summary / Descripción"
      description: "What actually failed? What result did you expect?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / Pasos"
      description: "Minimal, safe, reproducible steps with an authorized local target."
      placeholder: "1. Start a synthetic service on 127.0.0.1 ... 2. Configure Saturivo ... 3. Run ... "
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: "Environment / Entorno"
      description: "Saturivo commit/version, VS Code, OS, extension host, Go/k6/Node versions."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Sanitized logs or screenshots / Evidencia anonimizada"
      description: "Never paste internal URLs, stack dumps with secrets, token values or customer data."
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: "Safety confirmation / Seguridad"
      options:
        - label: "I removed secrets and private/customer data from this issue."
          required: true
        - label: "I used an authorized test target and no third-party production service."
          required: true
