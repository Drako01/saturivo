name: "Performance regression / Regresión de rendimiento"
description: "Report an evidence-backed local performance issue without exposing private services"
title: "[Performance]: "
body:
  - type: markdown
    attributes:
      value: "Only submit sanitized measurements. A single P95 sample is not proof of regression. Never include production API URLs, customer traces, credentials or confidential workloads."
  - type: textarea
    id: scenario
    attributes:
      label: "Reproducible local scenario"
      description: "Method, synthetic endpoint, concurrency/arrival model, duration, budgets, SLO and local fixture."
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: "Baseline and candidate results"
      description: "RPS, P50/P95/P99, failures, dropped iterations, number of repeated trials and uncertainty."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment fingerprint"
      description: "Runtime/OS, CPU, k6/Go versions, git SHA, relevant load-generator conditions."
    validations:
      required: true
  - type: textarea
    id: hypothesis
    attributes:
      label: "Observed evidence and hypotheses"
      description: "Separate measured facts from suspected causes and state any test limitations."
    validations:
      required: false
